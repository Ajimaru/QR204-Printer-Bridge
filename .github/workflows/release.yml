name: release

# Builds the installable config bundle and drafts a GitHub Release from it.
#
# - A tag (v* or a bare version number) builds the bundle and creates a DRAFT
#   release. Pushing a tag never publishes on its own: the draft is published by
#   hand once the notes and the attached files have been checked.
# - Pull requests and manual runs build and check the same bundle but create no
#   release, so a broken bundle shows up before anyone tags.
#
# The bundle holds the ESPHome config, not a firmware image: WiFi credentials and
# the API key are compiled into the firmware, so a prebuilt .bin would either not
# connect or ship someone else's secrets. Users compile it themselves (see the
# Setup Guide in the wiki).
on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a run that is cutting a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # A release must come from reviewed code: main is protected, a tag is not.
      - name: Tag must be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on main"
            exit 1
          fi

      - name: Build bundle
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then VERSION="${REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          NAME="QR204-Printer-Bridge-${VERSION}"
          mkdir -p "dist/$NAME/housing"
          cp esphome/thermal-printer.yaml esphome/printer_bridge.h esphome/secrets.yaml.example "dist/$NAME/"
          cp "Thermal Printer Housing"/*.stl "dist/$NAME/housing/"
          cp LICENSE SECURITY.md "dist/$NAME/"
          cat > "dist/$NAME/INSTALL.md" <<'EOT'
          # Install

          1. Copy `secrets.yaml.example` to `secrets.yaml` and fill in all five values.
             Generate the API key with `openssl rand -base64 32`.
          2. Put `thermal-printer.yaml`, `printer_bridge.h` and `secrets.yaml` in one folder
             (Home Assistant: `/homeassistant/esphome/`).
          3. First flash over USB: ESPHome Device Builder -> thermal-printer -> Install -> Plug into
             this computer, or `esphome run thermal-printer.yaml` with the ESPHome CLI.

          Wiring, power supply and tests are in the wiki, start with the Setup Guide:
          https://github.com/Ajimaru/QR204-Printer-Bridge/wiki/Setup-Guide

          The bridge has no authentication on TCP port 9100. Read SECURITY.md first.
          EOT
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Proves the bundle is installable as shipped: the example must contain every
      # secret the config asks for, and the config must resolve from the bundle folder.
      - name: Check the bundle installs
        run: |
          python -m pip install --upgrade pip
          python -m pip install esphome
          cd "dist/$NAME"
          sed "s|^api_encryption_key: .*|api_encryption_key: \"$(openssl rand -base64 32)\"|" secrets.yaml.example > secrets.yaml
          esphome config thermal-printer.yaml > /dev/null
          rm secrets.yaml

      - name: Zip
        run: |
          cd dist
          zip -rq "$NAME.zip" "$NAME"
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          unzip -l "$NAME.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist

      - name: Determine prerelease
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_LOWER="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]')"
          # Prerelease = an a/b/rc/dev/alpha/beta segment in the tag, with a digit or
          # separator before it (0.2.0-rc1, 0.2.0.dev3). The match must end at the end
          # of the tag, so the letters inside a word can never flip the detection.
          if echo "$TAG_LOWER" | grep -qE '(^|[-.0-9])(a|b|rc|dev|alpha|beta)([.-]?[0-9]+)?($|\+)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Always a draft. Notes are grouped by PR label; the categories live in
      # .github/release.yml.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          args=(--draft --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* "${args[@]}"
